<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Circles</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Syne+Mono&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0b;
  --text: #f4f0eb;
  --muted: rgba(244,240,235,0.35);
  --border: rgba(244,240,235,0.1);
  --c-green: #4ade80;
  --c-yellow: #facc15;
  --c-orange: #fb923c;
  --c-red: #ef4444;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne Mono', monospace;
  overflow: hidden;
}

/* ── TOP BAR ── */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  z-index: 100;
  background: linear-gradient(to bottom, var(--bg) 60%, transparent);
}

.app-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem;
  letter-spacing: 0.02em;
  color: var(--text);
  opacity: 0.9;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: calc(100vw - 80px);
  font-size: 0.95rem;
}

.btn-plus {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--text);
  color: var(--bg);
  border: none;
  font-size: 1.5rem;
  line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s, opacity 0.2s;
  box-shadow: 0 2px 16px rgba(0,0,0,0.5);
  font-family: 'Syne Mono', monospace;
}
.btn-plus:active { transform: scale(0.9); opacity: 0.8; }

/* ── CIRCLES SCROLL AREA ── */
.circles-wrap {
  position: fixed;
  top: 64px; bottom: 0; left: 0; right: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-evenly;
  padding: 8px 0;
  
}


/* 3 true circles fit on screen — size = 28vw diameter, centered */
.circle-slot {
  width: 100vw;
  height: calc((100vh - 72px) / 3);
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex-shrink: 0;
}

.circle-slot .circle,
.circle-slot .circle-empty-slot {
  /* true circle: diameter = min(28vh, 88vw) */
  width: min(calc((100vh - 72px) / 3 - 16px), 88vw);
  height: min(calc((100vh - 72px) / 3 - 16px), 88vw);
  flex-shrink: 0;
}

.circle {
  border-radius: 50%;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  /* entry animation */
  animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

@keyframes popIn {
  from { transform: scale(0.7); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}

/* background ring */
.circle-bg {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: #1a1a1e;
  border: 1.5px solid var(--border);
}

/* liquid fill — grows from bottom */
.circle-fill {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  border-radius: 0 0 50% 50% / 0 0 40% 40%;
  transition: height 1.2s cubic-bezier(0.4, 0, 0.2, 1),
              background 1.2s ease;
  /* wavy top via pseudo */
}

.circle-fill::before {
  content: '';
  position: absolute;
  top: -6px; left: -10%; right: -10%;
  height: 14px;
  background: inherit;
  border-radius: 50%;
  animation: wave 3s ease-in-out infinite;
}

@keyframes wave {
  0%, 100% { transform: scaleX(1) translateY(0); }
  50%       { transform: scaleX(1.05) translateY(-3px); }
}

/* shine */
.circle-shine {
  position: absolute;
  top: 10%; left: 15%;
  width: 35%; height: 30%;
  background: radial-gradient(ellipse, rgba(255,255,255,0.12) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}

/* content */
.circle-content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px;
  gap: 5px;
}

.circle-name {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1rem, 4.5vw, 1.5rem);
  font-weight: 700;
  text-align: center;
  line-height: 1.2;
  color: #fff;
  text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  max-width: 75%;
}

.circle-countdown {
  font-size: clamp(0.65rem, 3vw, 0.85rem);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.75);
  text-shadow: 0 1px 6px rgba(0,0,0,0.7);
}

.circle-pct {
  font-size: clamp(0.55rem, 2.5vw, 0.72rem);
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.1em;
}

/* empty slot */
.circle-empty-slot {
  border-radius: 50%;
  border: 1.5px dashed var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  cursor: default;
}

/* overdue pulse */
@keyframes pulse {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.6; }
}
.is-overdue { animation: pulse 1.2s ease-in-out infinite; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.modal {
  background: #18181c;
  border: 1px solid var(--border);
  border-radius: 28px 28px 0 0;
  padding: 32px 28px 48px;
  width: 100%;
  max-width: 480px;
  transform: translateY(40px);
  transition: transform 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
}
.modal-overlay.open .modal { transform: translateY(0); }

.modal-handle {
  width: 40px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 28px;
}

.modal-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem;
  margin-bottom: 24px;
}

.field { margin-bottom: 18px; }
.field label {
  display: block;
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}

.field input {
  width: 100%;
  background: #0e0e10;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 18px;
  color: var(--text);
  font-family: 'Syne Mono', monospace;
  font-size: 0.95rem;
  outline: none;
  -webkit-appearance: none;
  transition: border-color 0.2s;
}
.field input:focus { border-color: rgba(244,240,235,0.4); }
.field input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6); }

.btn-save {
  width: 100%;
  background: var(--text);
  color: var(--bg);
  border: none;
  border-radius: 14px;
  padding: 16px;
  font-family: 'Syne Mono', monospace;
  font-size: 0.9rem;
  letter-spacing: 0.08em;
  cursor: pointer;
  margin-top: 8px;
  transition: opacity 0.2s, transform 0.15s;
}
.btn-save:active { transform: scale(0.97); opacity: 0.85; }

/* ── TASK LIST MODAL ── */
.list-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.list-modal-overlay.open { opacity: 1; pointer-events: all; }

.list-modal {
  background: #18181c;
  border: 1px solid var(--border);
  border-radius: 28px 28px 0 0;
  padding: 28px 24px 48px;
  width: 100%;
  max-width: 480px;
  max-height: 70vh;
  display: flex;
  flex-direction: column;
  transform: translateY(40px);
  transition: transform 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
}
.list-modal-overlay.open .list-modal { transform: translateY(0); }

.list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.list-modal-title { font-family: 'Playfair Display', serif; font-size: 1.2rem; }
.btn-close-list {
  background: none; border: none;
  color: var(--muted); font-size: 1.4rem;
  cursor: pointer; line-height: 1;
}

.task-scroll { overflow-y: auto; flex: 1; }

.task-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 4px;
  border-bottom: 1px solid var(--border);
}
.task-row:last-child { border-bottom: none; }

.task-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 6px currentColor;
}

.task-info { flex: 1; }
.task-row-name { font-size: 0.88rem; margin-bottom: 2px; }
.task-row-date { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.08em; }

.btn-del {
  background: none; border: none;
  color: var(--muted); font-size: 1.1rem;
  cursor: pointer; padding: 4px 6px;
  transition: color 0.2s;
  line-height: 1;
}
.btn-del:hover { color: var(--c-red); }

.empty-msg { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 20px 0; }

/* scroll indicator dots */
.dot-nav {
  position: fixed;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 50;
}
.nav-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--border);
  transition: background 0.3s, transform 0.3s;
}
.nav-dot.active { background: var(--text); transform: scale(1.5); }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <span class="app-title">Circles&nbsp;<span style="opacity:0.4;font-size:0.8em;">|</span>&nbsp;<span style="opacity:0.55;font-size:0.78em;font-family:'Syne Mono',monospace;letter-spacing:0.04em;">Bahre's deadline system</span></span>
  <button class="btn-plus" onclick="openAdd()" aria-label="Add task">+</button>
</div>

<!-- CIRCLES -->
<div class="circles-wrap" id="circlesWrap"></div>

<!-- NAV DOTS -->
<div class="dot-nav" id="dotNav"></div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="addModal" onclick="closeAdd(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">New deadline</div>
    <div class="field">
      <label>What's the task?</label>
      <input type="text" id="inName" placeholder="e.g. Submit report" maxlength="50">
    </div>
    <div class="field">
      <label>Deadline date</label>
      <input type="date" id="inDate">
    </div>
    <button class="btn-save" onclick="saveTask()">Add it</button>
  </div>
</div>

<!-- ALL TASKS MODAL -->
<div class="list-modal-overlay" id="listModal" onclick="closeList(event)">
  <div class="list-modal">
    <div class="modal-handle"></div>
    <div class="list-header">
      <div class="list-modal-title">All tasks</div>
      <button class="btn-close-list" onclick="closeListDirect()">×</button>
    </div>
    <div class="task-scroll" id="taskScroll"></div>
  </div>
</div>

<script>
// ── DATA ─────────────────────────────────────────────────
let tasks = JSON.parse(localStorage.getItem('circles_v2') || '[]');
function save() { localStorage.setItem('circles_v2', JSON.stringify(tasks)); }

// ── URGENCY ───────────────────────────────────────────────
function urgency(dateStr) {
  const now = new Date();
  const deadline = new Date(dateStr + 'T23:59:59');
  const windowMs = 30 * 24 * 3600 * 1000; // 30 day window
  const remainMs = deadline - now;
  if (remainMs <= 0) return 1;
  return Math.min(1, Math.max(0, 1 - remainMs / windowMs));
}

function fillColor(r) {
  if (r >= 1) return '#ef4444';
  if (r > 0.7) {
    const t = (r - 0.7) / 0.3;
    return `rgb(${Math.round(251 + (239-251)*t)},${Math.round(146*(1-t))},${Math.round(60*(1-t))})`;
  }
  if (r > 0.35) {
    const t = (r - 0.35) / 0.35;
    return `rgb(${Math.round(74 + (251-74)*t)},${Math.round(222 - (222-146)*t)},${Math.round(128*(1-t))})`;
  }
  return '#4ade80';
}

function countdown(dateStr) {
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  const diff = Math.round((d - now) / 86400000);
  if (diff < 0) return `${Math.abs(diff)}d overdue`;
  if (diff === 0) return 'due today';
  if (diff === 1) return '1 day left';
  return `${diff} days left`;
}

function sorted() {
  return [...tasks].sort((a, b) => new Date(a.date) - new Date(b.date));
}

// ── RENDER ────────────────────────────────────────────────
function render() {
  const list = sorted();
  const top3 = list.slice(0, 3);
  const wrap = document.getElementById('circlesWrap');
  const dotNav = document.getElementById('dotNav');

  wrap.innerHTML = '';
  dotNav.innerHTML = '';

  const slots = Math.max(3, top3.length);

  for (let i = 0; i < 3; i++) {
    const slot = document.createElement('div');
    slot.className = 'circle-slot';

    if (!top3[i]) {
      slot.innerHTML = `<div class="circle-empty-slot">empty</div>`;
      wrap.appendChild(slot);
      // dot
      const dot = document.createElement('div');
      dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
      dotNav.appendChild(dot);
      continue;
    }

    const t = top3[i];
    const r = urgency(t.date);
    const color = fillColor(r);
    const pct = Math.round(r * 100);
    const cd = countdown(t.date);
    const overdue = cd.includes('overdue');

    slot.innerHTML = `
      <div class="circle ${overdue ? 'is-overdue' : ''}" data-id="${t.id}" onclick="confirmDone(${t.id}, '${escJs(t.name)}')">
        <div class="circle-bg"></div>
        <div class="circle-fill" style="height:${pct}%; background:${color};"></div>
        <div class="circle-shine"></div>
        <div class="circle-content">
          <div class="circle-name">${escHtml(t.name)}</div>
          <div class="circle-countdown">${cd}</div>
          <div class="circle-pct">${pct}% urgent</div>
        </div>
      </div>
    `;

    wrap.appendChild(slot);

    // nav dot
    const dot = document.createElement('div');
    dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
    dotNav.appendChild(dot);
  }

  // if more tasks exist, show a hint
  if (list.length > 3) {
    const hint = document.createElement('div');
    hint.style.cssText = 'text-align:center;padding:16px 0 8px;font-size:0.7rem;letter-spacing:0.12em;color:rgba(244,240,235,0.3);cursor:pointer;';
    hint.textContent = `+ ${list.length - 3} more task${list.length - 3 > 1 ? 's' : ''}`;
    hint.onclick = openList;
    wrap.appendChild(hint);
  }

  // scroll nav

}

function updateDots() {
  const wrap = document.getElementById('circlesWrap');
  const slots = wrap.querySelectorAll('.circle-slot');
  const dots = document.querySelectorAll('.nav-dot');
  const scrollY = wrap.scrollTop;
  const h = wrap.clientHeight;
  let active = 0;
  slots.forEach((s, i) => {
    if (s.offsetTop <= scrollY + h / 2) active = i;
  });
  dots.forEach((d, i) => d.classList.toggle('active', i === active));
}

// ── ACTIONS ──────────────────────────────────────────────
function confirmDone(id, name) {
  if (confirm(`Mark "${name}" as done?`)) {
    tasks = tasks.filter(t => t.id !== id);
    save(); render();
  }
}

// ── ADD MODAL ─────────────────────────────────────────────
function openAdd() {
  document.getElementById('addModal').classList.add('open');
  setTimeout(() => document.getElementById('inName').focus(), 300);
}
function closeAdd(e) {
  if (e.target === document.getElementById('addModal')) document.getElementById('addModal').classList.remove('open');
}

function saveTask() {
  const name = document.getElementById('inName').value.trim();
  const date = document.getElementById('inDate').value;
  if (!name || !date) { alert('Please fill in both fields.'); return; }
  tasks.push({ id: Date.now(), name, date });
  save();
  document.getElementById('inName').value = '';
  document.getElementById('inDate').value = '';
  document.getElementById('addModal').classList.remove('open');
  render();
}

// ── LIST MODAL ────────────────────────────────────────────
function openList() {
  renderList();
  document.getElementById('listModal').classList.add('open');
}
function closeList(e) {
  if (e.target === document.getElementById('listModal')) closeListDirect();
}
function closeListDirect() {
  document.getElementById('listModal').classList.remove('open');
}

function renderList() {
  const list = sorted();
  const el = document.getElementById('taskScroll');
  if (list.length === 0) { el.innerHTML = '<div class="empty-msg">No tasks yet.</div>'; return; }
  el.innerHTML = list.map(t => {
    const r = urgency(t.date);
    const color = fillColor(r);
    const cd = countdown(t.date);
    return `
      <div class="task-row">
        <div class="task-dot" style="background:${color};color:${color};"></div>
        <div class="task-info">
          <div class="task-row-name">${escHtml(t.name)}</div>
          <div class="task-row-date">${t.date} · ${cd}</div>
        </div>
        <button class="btn-del" onclick="delTask(${t.id})">×</button>
      </div>`;
  }).join('');
}

function delTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  save(); renderList(); render();
}

// ── UTILS ─────────────────────────────────────────────────
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escJs(s) { return s.replace(/'/g,"\\'"); }

// min date = today
const today = new Date().toISOString().split('T')[0];
document.getElementById('inDate').min = today;

// enter key
document.getElementById('inName').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('inDate').focus(); });
document.getElementById('inDate').addEventListener('keydown', e => { if (e.key === 'Enter') saveTask(); });

// long-press on app title → open all tasks
document.querySelector('.app-title').addEventListener('click', openList);

render();
setInterval(render, 60000);
</script>
</body>
</html>
